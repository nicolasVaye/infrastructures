      <line x1="30" y1="90" x2="56" y2="90"/>
      <line x1="212" y1="90" x2="236" y2="90"/>
      <line x1="30" y1="190" x2="62" y2="190"/>
      <line x1="206" y1="190" x2="236" y2="190"/>
    </g>
    <g fill="none" stroke="#22d3ee" stroke-width="3">
      <circle cx="20" cy="90" r="8"/><circle cx="246" cy="90" r="8"/>
      <circle cx="20" cy="190" r="8"/><circle cx="246" cy="190" r="8"/>
    </g>
