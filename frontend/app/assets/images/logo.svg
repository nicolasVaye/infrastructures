    <path d="M 96 0 L 192 56 L 192 168 L 96 224 L 0 168 L 0 56 Z"
          transform="translate(96,-16) scale(0.86)"
          fill="none" stroke="#2563eb" stroke-width="5" opacity="0.9"/>
    <!-- server rack -->
    <g transform="translate(96,40)">
      <rect x="-40" y="0" width="80" height="112" rx="8" fill="#1e293b" stroke="#2563eb" stroke-width="4"/>
      <g fill="#3b82f6">
        <rect x="-28" y="14" width="56" height="8" rx="2"/>
        <rect x="-28" y="32" width="56" height="8" rx="2"/>
        <rect x="-28" y="50" width="56" height="8" rx="2"/>
        <rect x="-28" y="68" width="56" height="8" rx="2"/>
      </g>
      <g fill="#22d3ee">
        <circle cx="-20" cy="18" r="3"/>
        <circle cx="-20" cy="36" r="3"/>
        <circle cx="-20" cy="54" r="3"/>
        <circle cx="-20" cy="72" r="3"/>
      </g>
      <!-- network node below rack -->
      <line x1="0" y1="112" x2="0" y2="140" stroke="#2563eb" stroke-width="4"/>
      <circle cx="0" cy="150" r="10" fill="none" stroke="#22d3ee" stroke-width="4"/>
      <circle cx="0" cy="150" r="3" fill="#22d3ee"/>
    </g>
    <!-- side connection lines -->
