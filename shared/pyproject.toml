[project]
name = "infrastructures-shared"
version = "0.1.0"
description = "Shared DTOs, enums and API clients for the infrastructures monorepo"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "email-validator>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]
