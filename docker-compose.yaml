# Infrastructures monorepo — full stack (Postgres + API + workers + NiceGUI frontend)
#
#   docker compose up --build
#
#   frontend  → http://localhost:8080   (login: admin / admin, forced password change)
#   api       → http://localhost:8000/docs
#
# Horizontal scaling examples:
#   docker compose up --scale backend=3 --scale worker=4

services:
  postgres:
    image: postgres:16-alpine
    environment:
      # Dev default below; production MUST override via .env (the backend
      # fail-fasts on default JWT/admin secrets, the DB password is your
      # first line of defence for the data itself).
      POSTGRES_USER: infra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infra}
      POSTGRES_DB: infrastructures
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infra -d infrastructures"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: &backend_env
      DATABASE_URL: postgresql+asyncpg://infra:${POSTGRES_PASSWORD:-infra}@postgres:5432/infrastructures
      # PRODUCTION: set a strong JWT_SECRET (>= 32 chars) in .env — the
      # backend REFUSES to boot with the default value unless INSECURE_DEV=1.
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      # PRODUCTION: change the seed admin password — the backend refuses the
      # default 'admin' unless INSECURE_DEV=1 (it must still be changed at
      # first login, but the shipped value must not be the live one).
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin}
      CORS_ORIGINS: '["http://localhost:8080"]'
      # Public URL of the frontend as seen from the browser; the OIDC
      # redirect_uri is {base}/auth/oidc/callback
      OIDC_REDIRECT_BASE_URL: ${OIDC_REDIRECT_BASE_URL:-http://localhost:8080}
    ports:
      # Localhost-only: the API is not meant to be exposed (the frontend
      # proxies browser traffic over the compose network). A public port
      # would let anyone bypass the frontend and hammer /auth/login
      # directly — the backend now rate-limits, but there is no reason to
      # keep the door open either.
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Readiness = HTTP + actual database round-trip (see GET /health):
      # a starting container must not receive traffic before the schema is
      # migrated and Postgres answers.
      test: ["CMD-SHELL",
             "python -c \"import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    # Same image as the backend; only the command differs. Scale freely:
    # every replica claims jobs with FOR UPDATE SKIP LOCKED.
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uv", "run", "python", "-m", "app.worker"]
    environment:
      <<: *backend_env
      SCHEDULER: "0"   # run the CRON scheduler on exactly one replica in production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    # Dedicated single-instance CRON scheduler (enqueues jobs into the queue).
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uv", "run", "python", "-m", "app.worker"]
    environment:
      <<: *backend_env
      SCHEDULER: "1"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
      STORAGE_SECRET: ${STORAGE_SECRET:-please-change-me}
      # Shared storage backend for multi-replica deployments (see README):
      # NiceGUI keeps its session storage in per-process FILES by default —
      # with more than one frontend replica every browser session must land
      # on the same replica (sticky sessions) OR the storage must be shared
      # via Redis. Empty (default) = local file storage.
      NICEGUI_REDIS_URL: ${NICEGUI_REDIS_URL:-}
    ports:
      - "8080:8080"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL",
             "python -c \"import urllib.request as u; u.urlopen('http://localhost:8080/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    # Note: NiceGUI holds a WebSocket per browser session — put a sticky-session
    # load balancer in front if you scale this service beyond one replica.

  # Optional local Keycloak for testing the OIDC federation end to end:
  #   docker compose --profile keycloak up
  #   - admin console: http://localhost:8081  (admin/admin, change in .env)
  #   - create a realm, a confidential client with redirect_uri:
  #     http://localhost:8080/auth/oidc/callback
  #   - then declare the provider on the frontend 'Providers' page with
  #     issuer_url http://keycloak:8080/realms/<realm> (or the public URL)
  # Keycloak listens on 8081 directly (same port inside and outside), and the
  # network alias 'keycloak.localhost' lets the backend container resolve the
  # issuer URL exactly like the browser does (*.localhost -> 127.0.0.1 from
  # the host, alias -> keycloak container from the compose network). No
  # host-gateway / host-firewall involved.
  # Declare in /settings -> Providers: issuer_url
  #   http://keycloak.localhost:8081/realms/<realm>
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    profiles: ["keycloak"]
    command: ["start-dev", "--http-port=8081"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    networks:
      default:
        aliases:
          - keycloak.localhost
    ports:
      - "8081:8081"
    volumes:
      - keycloak_data:/opt/keycloak/data
    restart: unless-stopped

volumes:
  pgdata:
  keycloak_data:
