name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    name: Lint + compile + i18n + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Install Python
        run: uv python install 3.12

      - name: Byte-compile every package (syntax gate)
        run: python -m compileall -q backend/app frontend/app shared/src

      - name: i18n completeness check (en/de/fr, no duplicates)
        run: python scripts/check_i18n.py

      - name: Install backend + dev dependencies
        working-directory: backend
        run: uv sync --extra dev

      - name: Ruff (backend)
        uses: astral-sh/ruff-action@v3
        with:
          args: check backend

      - name: Backend tests (SQLite, in-process)
        working-directory: backend
        run: uv run pytest -q
        env:
          INSECURE_DEV: "1"
          JWT_SECRET: "ci-secret-ci-secret-ci-secret-ci-secret"
